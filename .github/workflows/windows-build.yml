name: Windows Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
    - name: Build Premake Project Files
      working-directory: ./Scripts
      run: ./Setup-Windows.bat
    - name: show dir
      run: dir
    - name: Build the Solution
      run: msbuild.exe RealgarEngine.sln /m /p:Configuration=Debug
    - name: Build the Solution
      run: msbuild.exe RealgarEngine.sln /m /p:Configuration=Release

    - name: Archive Editor artifact
      uses: actions/upload-artifact@v4
      with:
        name: Editor
        path: |
            Binaries/windows-x86_64/Release/Editor/Editor.exe
            
    - name: Archive Game artifact
      uses: actions/upload-artifact@v4
      with:
        name: Editor
        path: |
            Binaries/windows-x86_64/Release/Game/Game.exe
