name: Windows Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (Release)
        run: |
          cmake -S . -B cmake-build-release `
                -G "Visual Studio 17 2022" -A x64 `
                -DCMAKE_BUILD_TYPE=Release

      - name: Build Editor
        run: cmake --build cmake-build-release --target Editor --config Release --parallel

      - name: Build Game
        run: cmake --build cmake-build-release --target Game --config Release --parallel

      - name: Archive Editor artifact
        uses: actions/upload-artifact@v4
        with:
          name: Editor-Windows
          path: Binaries/windows-x86_64/Release/Editor/Editor.exe

      - name: Archive Game artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game-Windows
          path: Binaries/windows-x86_64/Release/Game/Game.exe